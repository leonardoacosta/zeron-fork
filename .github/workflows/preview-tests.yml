name: Preview networking
on:
  pull_request:
  push:
    branches: [main]
    paths: ['crates/preview/**', 'crates/proto/**', 'Cargo.toml', 'Cargo.lock', 'edge/**', '.github/workflows/preview-tests.yml']
permissions:
  contents: read
concurrency:
  group: preview-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  networking:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p zeron-preview
  coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  preview-promotion:
    if: always()
    needs: [networking, coordinator]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Preview check
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED: networking,coordinator
        shell: bash
        run: |
          python3 -c 'import json,os,sys; results=json.loads(os.environ["RESULTS"]); required=os.environ["REQUIRED"].split(","); failed=[name for name in required if name not in results or results[name].get("result") != "success"]; print("missing or non-success required jobs:", failed); sys.exit(bool(failed))'
